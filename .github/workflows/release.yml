name: Release
# Cut a release by pushing a tag: git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Tag must match VERSION and be on main
        run: |
          [ "${GITHUB_REF_NAME#v}" = "$(cat VERSION)" ] || { echo "Tag ${GITHUB_REF_NAME} != VERSION $(cat VERSION)"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag is not on main"; exit 1; }
          grep -q "^## \[$(cat VERSION)\]" CHANGELOG.md || { echo "CHANGELOG.md has no entry for $(cat VERSION)"; exit 1; }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r backend/requirements-render.txt pytest
      - run: python -m pytest backend/tests -q
      - run: python backend/evaluation/run_eval.py --check
      - run: python backend/evaluation/answer_eval.py --check
      - name: Publish GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          python - <<'PY' > notes.md
          import re,os
          v=open("VERSION").read().strip()
          t=open("CHANGELOG.md").read()
          m=re.search(r"^## \[%s\].*?(?=^## \[|\Z)"%re.escape(v),t,re.S|re.M)
          print(m.group(0).split("\n",1)[1].strip())
          PY
          cat docs/EVAL_REPORT.md | sed -n '1,/^### Routing misses/p' | head -n -1 >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
