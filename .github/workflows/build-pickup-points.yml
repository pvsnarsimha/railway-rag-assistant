name: Build station pickup points
# Looks up real pickup spots (taxi/bus stands, entrances, gates, clock towers,
# parcel offices) around stations from OpenStreetMap and opens a PR with
# backend/data/station_pickup_points.json. Run it again to add the next batch.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Stations to look up this run"
        default: "400"

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/build_pickup_points.py --limit "${{ github.event.inputs.limit }}"
      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Add station pickup points from OpenStreetMap"
          branch: bot/station-pickup-points
          title: "Add station pickup points from OpenStreetMap"
          body: "Generated by tools/build_pickup_points.py. Review a few stations (e.g. BZA) before merging."
