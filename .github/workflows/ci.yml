name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-render.txt
      - name: Repo hygiene (no loose patches, VERSION well-formed)
        run: |
          if ls *.patch *.diff *.orig *.rej 2>/dev/null | grep -q .; then
            echo "Loose patch files in repo root. Commit the change instead."; exit 1; fi
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION
      - name: Install (same lean set production uses, plus test tools)
        run: pip install -r backend/requirements-render.txt pytest
      - name: Unit + regression tests
        run: python -m pytest backend/tests -q
      - name: Evaluation gate (routing, retrieval, latency thresholds)
        run: python backend/evaluation/run_eval.py --check
      - name: Answer-quality gate (offline answer path)
        run: python backend/evaluation/answer_eval.py --check
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            docs/EVAL_REPORT.md
            docs/eval_results.json
            docs/ANSWER_EVAL_REPORT.md
            docs/answer_eval_results.json
